# Used by FastAPI Cloud to run the recruiter workspace (web/backend + the built React app in web/frontend/dist).
# Local reproduction does not use this file: `make setup` installs requirements.txt (which adds the embedding model,
# Streamlit and the evaluation tooling). The cloud runs with HYT_LITE=1, so the embedding model is not needed there.
[project]
name = "hyt-screening"
version = "1.3.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]==0.143.1",
    "python-multipart==0.0.32",
    "google-genai==2.30.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.14.6",
    "langdetect==1.0.9",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "pdfminer-six==20260107",
    "pypdfium2==5.14.0",
]

[tool.fastapi]
entrypoint = "web.backend.main:app"
